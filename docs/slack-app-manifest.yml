# Manifiesto de la Slack app que Bloc usa para agendar recordatorios.
#
# Pegalo en api.slack.com/apps → Create New App → From a manifest.
# Los scopes son el mínimo que hace falta:
#
#   chat:write        escribir el mensaje y agendarlo
#   im:write          abrir el DM con vos, que es a donde llega
#   users:read.email  encontrarte por tu mail (opcional: ver el README)
#   users:read        dependencia que la consola de Slack exige junto al anterior
#
# token_rotation_enabled queda en false a propósito: un token que rota se vence
# solo, y Bloc se quedaría sin poder agendar sin avisar.

display_information:
  name: Bloc
  description: Te manda tus notas de Bloc a la hora que le pediste
  background_color: "#c96a0c"

features:
  bot_user:
    display_name: Bloc
    always_online: false

oauth_config:
  scopes:
    bot:
      - chat:write
      - im:write
      - users:read.email
      - users:read

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
